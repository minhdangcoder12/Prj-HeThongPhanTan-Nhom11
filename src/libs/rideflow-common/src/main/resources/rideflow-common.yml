# Shared service config. Each service: spring.config.import: classpath:rideflow-common.yml + sets rideflow.db.
spring:
  cloud:
    consul:
      # Tắt mặc định để ./mvnw verify và chạy local không cần Consul; compose bật bằng CONSUL_ENABLED=true.
      enabled: ${CONSUL_ENABLED:false}
      host: ${CONSUL_HOST:localhost}
      discovery:
        # instance-id duy nhất để scale nhiều instance cùng một service (scripts/scale.sh).
        instance-id: ${spring.application.name}-${random.uuid}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        # Instance critical quá 30s thì Consul tự gỡ đăng ký.
        health-check-critical-timeout: 30s
        # Chỉ trả instance đang passing.
        query-passing: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${rideflow.db}
    username: ${POSTGRES_USER:rideflow_admin}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Bounded retry 2s -> 5s -> 10s, then reject without requeue: message goes to <queue>.dlq.
        # shortcut: in-listener retry blocks the consumer thread during backoff; move to TTL retry queues if throughput matters.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 2s
          multiplier: 2.5
          max-interval: 10s
  mvc:
    problemdetails:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
logging:
  pattern:
    level: "%5p [${spring.application.name:-},%X{correlationId:-}]"
