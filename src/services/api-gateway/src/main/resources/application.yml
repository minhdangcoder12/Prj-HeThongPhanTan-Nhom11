server:
  port: ${PORT:8080}
spring:
  application:
    name: api-gateway
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  cloud:
    consul:
      # Tắt mặc định để ./mvnw verify và chạy local không cần Consul; compose bật bằng CONSUL_ENABLED=true.
      enabled: ${CONSUL_ENABLED:false}
      host: ${CONSUL_HOST:localhost}
      discovery:
        # instance-id duy nhất để scale nhiều instance cùng một service (scripts/scale.sh).
        instance-id: ${spring.application.name}-${random.uuid}
        prefer-ip-address: true
        health-check-path: /actuator/health
        health-check-interval: 10s
        # Instance critical quá 30s thì Consul tự gỡ đăng ký.
        health-check-critical-timeout: 30s
        # Chỉ trả instance đang passing.
        query-passing: true
    gateway:
      # Gateway and the downstream CorrelationIdFilter both set the header; keep one.
      default-filters:
        - DedupeResponseHeader=X-Correlation-Id, RETAIN_FIRST
        # Spec 4.5 "limit message sizes": larger bodies get 413 at the edge.
        - name: RequestSize
          args:
            maxSize: 64KB
      # Only /api/** is exposed. /internal/** is never routed (rule R1).
      routes:
        - id: user
          uri: ${rideflow.services.user}
          predicates: [ "Path=/api/users/**,/api/auth/**" ]
        - id: driver
          uri: ${rideflow.services.driver}
          predicates: [ "Path=/api/drivers/**" ]
        - id: trip
          uri: ${rideflow.services.trip}
          predicates: [ "Path=/api/trips/**" ]
        - id: matching
          uri: ${rideflow.services.matching}
          predicates: [ "Path=/api/matching/**" ]
        - id: payment
          uri: ${rideflow.services.payment}
          predicates: [ "Path=/api/payments/**" ]
        - id: notification
          uri: ${rideflow.services.notification}
          predicates: [ "Path=/api/notifications/**" ]
rideflow:
  jwt:
    secret: ${JWT_SECRET}
  services:
    # lb:// qua Consul; chạy không Consul thì ghi đè bằng RIDEFLOW_SERVICES_<TÊN>=http://host:port.
    user: lb://user-service
    driver: lb://driver-service
    trip: lb://trip-service
    matching: lb://matching-service
    payment: lb://payment-service
    notification: lb://notification-service
management:
  endpoints:
    web:
      exposure:
        include: health,info
logging:
  pattern:
    level: "%5p [api-gateway,%X{correlationId:-}]"
