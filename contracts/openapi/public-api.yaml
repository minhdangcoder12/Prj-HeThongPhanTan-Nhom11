openapi: 3.0.3
info:
  title: RideFlow public API (via api-gateway :8080)
  version: 0.1.0
  description: |
    Only /api/** is public. Errors are RFC 7807 ProblemDetail. Every request may carry X-Correlation-Id.
    x-phase = roadmap phase implementing the endpoint; 0 = already in the skeleton.
    x-profile: demo = exists only with SPRING_PROFILES_ACTIVE=demo.
    Auth: JWT HS256 (Authorization: Bearer <token>) checked at the gateway. Public: /api/auth/**, /api/monitor/** and every GET.
    All other requests need a token, else 401. The gateway strips client X-User-Id / X-User-Role / X-Driver-Id and
    sets them from the token; services re-check the role on write endpoints (wrong role -> 403).
servers:
  - url: http://localhost:8080

paths:
  /api/auth/register:
    post:
      x-phase: 1
      summary: "Register a PASSENGER or DRIVER account (ADMIN cannot self-register). Never returns the password hash"
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
                fullName: { type: string }
                role: { type: string, enum: [PASSENGER, DRIVER] }
      responses:
        "201": { description: "User { id, email, fullName, role, driverId, createdAt }" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/auth/login:
    post:
      x-phase: 1
      summary: Login, returns JWT (HS256, 8h; claims sub=userId, role, driverId for DRIVER)
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        "200": { description: "{ token, userId, role, driverId } (driverId only for seeded DRIVER accounts)" }
        "401": { description: "Same message for unknown email and wrong password", content: { application/problem+json: { schema: { type: object } } } }

  /api/trips:
    get:
      x-phase: 0
      summary: Recent trips (monitor)
      responses: { "200": { description: Trip[] } }
    post:
      x-phase: 1
      summary: "PASSENGER requests a trip (passengerId = X-User-Id from the token) -> REQUESTED, emits trip.created. fare (VND) = 12000 + 4000/km haversine, rounded up to 1000. Same Idempotency-Key returns the first trip"
      parameters: [ { $ref: "#/components/parameters/IdempotencyKey" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateTrip" } } }
      responses:
        "201": { description: Trip }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
  /api/trips/{id}:
    get:
      x-phase: 0
      summary: Trip by id
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: Trip }
        "404": { $ref: "#/components/responses/Problem" }
  /api/trips/{id}/accept:
    post: { x-phase: 1, summary: "DRIVER only. Driver accepts: DRIVER_ASSIGNED -> ACCEPTED", parameters: [ { $ref: "#/components/parameters/Id" } ], responses: { "200": { description: Trip }, "401": { $ref: "#/components/responses/Problem" }, "403": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } } }
  /api/trips/{id}/reject:
    post: { x-phase: 1, summary: "DRIVER only. Driver rejects: DRIVER_ASSIGNED -> MATCHING, emits trip.driver-rejected (payload.driverId = rejecting driver)", parameters: [ { $ref: "#/components/parameters/Id" } ], responses: { "200": { description: Trip }, "401": { $ref: "#/components/responses/Problem" }, "403": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } } }
  /api/trips/{id}/start:
    post: { x-phase: 1, summary: "DRIVER only. ACCEPTED -> IN_PROGRESS", parameters: [ { $ref: "#/components/parameters/Id" } ], responses: { "200": { description: Trip }, "401": { $ref: "#/components/responses/Problem" }, "403": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } } }
  /api/trips/{id}/complete:
    post: { x-phase: 1, summary: "DRIVER only. IN_PROGRESS -> COMPLETED, emits trip.completed", parameters: [ { $ref: "#/components/parameters/Id" } ], responses: { "200": { description: Trip }, "401": { $ref: "#/components/responses/Problem" }, "403": { $ref: "#/components/responses/Problem" }, "409": { $ref: "#/components/responses/Problem" } } }

  # Internal (service-to-service, NOT routed by the gateway); listed so callers and providers agree.
  /internal/trips/{id}/assign-driver:
    post:
      x-phase: 1
      x-internal: true
      summary: "Matching saga assigns a driver -> DRIVER_ASSIGNED, emits trip.driver-assigned. Same key or same driver again = no-op 200"
      parameters: [ { $ref: "#/components/parameters/Id" }, { name: Idempotency-Key, in: header, required: true, schema: { type: string } } ]
      requestBody:
        content: { application/json: { schema: { type: object, required: [driverId], properties: { driverId: { type: string, format: uuid } } } } }
      responses:
        "200": { description: Trip }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { description: "Trip already assigned to another driver, or not waiting for a driver", content: { application/problem+json: { schema: { type: object } } } }

  /api/drivers:
    get: { x-phase: 0, summary: All drivers (monitor), responses: { "200": { description: Driver[] } } }
  /api/drivers/{id}/availability:
    put:
      x-phase: 1
      summary: Go AVAILABLE / OFFLINE (DRIVER only, else 403), emits driver.availability-changed
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { available: { type: boolean } } } } }
      responses:
        "200": { description: Driver }
        "409": { $ref: "#/components/responses/Problem" }
  /api/drivers/{id}/location:
    put:
      x-phase: 1
      summary: Update simulated location (DRIVER only, else 403), emits driver.location-updated
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/Point" } } }
      responses: { "200": { description: Driver } }

  /api/matching/sagas:
    get: { x-phase: 0, summary: Recent sagas (monitor), responses: { "200": { description: MatchingSaga[] } } }
  /api/payments:
    get: { x-phase: 0, summary: Recent payments (monitor), responses: { "200": { description: Payment[] } } }
  /api/notifications:
    get: { x-phase: 0, summary: Recent notifications (monitor), responses: { "200": { description: Notification[] } } }
  /api/users:
    get: { x-phase: 0, summary: Users (monitor), responses: { "200": { description: User[] } } }

  /api/monitor/events:
    get: { x-phase: 0, summary: SSE stream of every message on rideflow.events and rideflow.dlx, responses: { "200": { description: text/event-stream } } }
  /api/monitor/health:
    get: { x-phase: 0, summary: UP or DOWN per service, responses: { "200": { description: "{ trip: UP, ... }" } } }
  /api/monitor/test-event:
    post: { x-phase: 0, x-profile: demo, summary: Publish a system.ping event, responses: { "200": { description: "{ eventId }" } } }
  /api/monitor/replay/{id}:
    post:
      x-phase: 0
      x-profile: demo
      summary: Re-publish a captured event with the SAME eventId (Flow D)
      parameters: [ { $ref: "#/components/parameters/Id" } ]
      responses:
        "200": { description: ok }
        "404": { $ref: "#/components/responses/Problem" }
  /api/chaos/trip/fail-assign:
    put:
      x-phase: 1
      x-profile: demo
      summary: "Make internal assign-driver return 503 (no change to the trip) until turned off, so the saga compensates (Flow E). Response { failAssign }"
      requestBody:
        content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean } } } } }
      responses: { "200": { description: ok } }
  /api/chaos/notification/fail-rate:
    put:
      x-phase: 5
      x-profile: demo
      summary: Fraction 0..1 of notification deliveries that throw (Flow C retry and DLQ)
      requestBody:
        content: { application/json: { schema: { type: object, properties: { rate: { type: number } } } } }
      responses: { "200": { description: ok } }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string } }
  responses:
    Problem:
      description: RFC 7807 ProblemDetail
      content: { application/problem+json: { schema: { type: object } } }
  schemas:
    Point: { type: object, required: [lat, lng], properties: { lat: { type: number, minimum: -90, maximum: 90 }, lng: { type: number, minimum: -180, maximum: 180 } } }
    CreateTrip:
      type: object
      required: [pickup, dropoff]
      properties:
        pickup: { $ref: "#/components/schemas/Point" }
        dropoff: { $ref: "#/components/schemas/Point" }
